name: Build & Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v3.1.7)'
        required: false
        default: 'v3.1.7'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Find the runner's vcpkg and image versions
        id: vcpkg
        shell: pwsh
        run: |
          $commit = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.image }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Build installer
        shell: pwsh
        run: .\build-windows.ps1

      - name: Verify Windows artifact
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path . -Filter "*Windows*_v*.exe" -File -ErrorAction SilentlyContinue
          if (-not $artifacts -or $artifacts.Count -eq 0) {
            throw "Windows build did not produce *Windows*_v*.exe"
          }
          Write-Host "Found Windows artifact(s):"
          $artifacts | ForEach-Object { Write-Host "  - $($_.Name)" }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: "*Windows*_v*.exe"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || (github.event.inputs.tag_name || 'v3.1.7') }}
          files: "*Windows*_v*.exe"
          name: 小褚播放器 (xcplay) Windows Release ${{ github.ref_type == 'tag' && github.ref_name || (github.event.inputs.tag_name || 'v3.1.7') }}
          body: |
            ## 小褚播放器 (xcplay) Windows Release ${{ github.ref_type == 'tag' && github.ref_name || (github.event.inputs.tag_name || 'v3.1.7') }}
            
            ### ✨ 更新内容
            - **软件重命名**：软件名称正式变更为「小褚播放器」（英文：xcplay），全面更新多语言本地化、应用窗口标题、安装器及安装路径。
            - **音频播放爆音/杂音彻底修复**：
              - 调大 mpv 音频缓冲至 500ms（`audio-buffer=0.5`），彻底消除 WASAPI 在 UI 渲染高负载下的 Buffer Underrun 断流撕裂杂音；
              - 开启多声道立体声下混防削波归一化（`audio-normalize-downmix=yes`），杜绝 5.1/7.1 声道叠加产生的数字硬削波破音；
              - 全面升级 `scaletempo2` 高保真时钟拉伸滤镜与高质量重采样参数，杜绝倍速与音视频微调时的相位杂音。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
