name: Build & Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v3.1.2)'
        required: false
        default: 'v3.1.2'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Find the runner's vcpkg and image versions
        id: vcpkg
        shell: pwsh
        run: |
          $commit = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.image }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Build installer
        shell: pwsh
        run: .\build-windows.ps1

      - name: Verify Windows artifact
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path . -Filter "Moonfin_Windows_v*.exe" -File -ErrorAction SilentlyContinue
          if (-not $artifacts -or $artifacts.Count -eq 0) {
            throw "Windows build did not produce Moonfin_Windows_v*.exe"
          }
          Write-Host "Found Windows artifact(s):"
          $artifacts | ForEach-Object { Write-Host "  - $($_.Name)" }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Moonfin_Windows_v*.exe

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || (github.event.inputs.tag_name || 'v3.1.2') }}
          files: Moonfin_Windows_v*.exe
          name: Moonfin Windows Release ${{ github.ref_type == 'tag' && github.ref_name || (github.event.inputs.tag_name || 'v3.1.2') }}
          body: |
            ## Moonfin Windows Release ${{ github.ref_type == 'tag' && github.ref_name || (github.event.inputs.tag_name || 'v3.1.6') }}
            
            ### ✨ 更新内容
            - **导航栏防误展**：桌面端点击音频、字幕、更多等弹窗关闭后，焦点恢复不再触发左侧侧边栏自动展开。
            - **导航栏智能收起**：展开侧边栏后，鼠标移出导航栏区域自动收起。
            - **媒体库标题补全**：修复聚合栏折叠显示时文字溢出被截断问题，完整显示“媒体库”标题。
            - **全局中文字体统一**：统一引入微软雅黑 (Microsoft YaHei)、苹方 (PingFang SC)、思源黑体 (Source Han Sans SC) 回退栈，彻底解决设置与按钮字体粗细高低不一致问题。
            - **媒体库显隐即时生效**：媒体库显隐修改关闭后自动强制刷新并清除已隐藏库数据。
            - **播放器控制栏优化**：播放/暂停/快进快退按键进一步下移贴近进度条上方，观影遮挡更少。
            - **侧边栏悬浮提示**：侧边栏收起状态下，鼠标悬停于图标上即显示文字气泡（首页、搜索、观影派对、媒体库、设置等）。
            - **配置导入与导出**：常规设置中新增“备份与还原”模块，支持完整导出 JSON 配置到剪贴板或文件，以及一键导入恢复配置。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
