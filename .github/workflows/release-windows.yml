name: Build & Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v3.1.9)'
        required: false
        default: 'v3.1.9'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Find the runner's vcpkg and image versions
        id: vcpkg
        shell: pwsh
        run: |
          $commit = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.image }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Build installer
        shell: pwsh
        run: .\build-windows.ps1

      - name: Verify Windows artifact
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path . -Filter "*Windows*_v*.exe" -File -ErrorAction SilentlyContinue
          if (-not $artifacts -or $artifacts.Count -eq 0) {
            throw "Windows build did not produce *Windows*_v*.exe"
          }
          Write-Host "Found Windows artifact(s):"
          $artifacts | ForEach-Object { Write-Host "  - $($_.Name)" }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: "*Windows*_v*.exe"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || (github.event.inputs.tag_name || 'v3.1.9') }}
          files: "*Windows*_v*.exe"
          name: 小褚播放器 (xcplay) Windows Release ${{ github.ref_type == 'tag' && github.ref_name || (github.event.inputs.tag_name || 'v3.1.9') }}
          body: |
            ## 小褚播放器 (xcplay) Windows Release ${{ github.ref_type == 'tag' && github.ref_name || (github.event.inputs.tag_name || 'v3.1.9') }}
            
            ### ✨ 更新内容
            - **Windows 原生标题栏深色模式与按钮修复**：强制启用 `DWMWA_USE_IMMERSIVE_DARK_MODE`，修复浅色系统主题下标题栏变白、关闭按钮白底白字隐形的渲染 Bug；显式配置高对比度暗黑底色、纯白标题字与控制按钮，确保最小化、最大化、关闭按钮始终清晰可见。
            - **视频播放界面顶部 OSD 窗口控制**：桌面端播放视频时，顶部栏右上角新增【最小化】、【最大化/全屏切换】、【关闭播放】快捷按钮，鼠标滑至右上角即可一键操作。
            - **播放器桌面端右键快捷上下文菜单**：右键点击播放画面即可唤起专业快捷菜单，快速切换播放/暂停、全屏、最小化、倍速（0.5x~2.0x）、音轨、字幕、码率及关闭播放。
            - **智能鼠标滚轮调节**：默认平滑调节音量，按住 Shift 或 Ctrl 滚动可即时微调快进/快退。
            - **主界面全屏窗口控制**：主界面在 F11 全屏浏览时顶栏右上角自动浮现窗口控制胶囊按钮，非全屏时无缝交由原生深色标题栏接管。
            - **多显示器拔插越界保护**：当副屏拔掉导致保存的窗口坐标失联时，自动居中恢复至当前主屏幕，彻底杜绝窗口“飞出屏幕外”。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
