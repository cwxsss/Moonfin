name: Build & Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v3.1.8)'
        required: false
        default: 'v3.1.8'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Find the runner's vcpkg and image versions
        id: vcpkg
        shell: pwsh
        run: |
          $commit = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.image }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Build installer
        shell: pwsh
        run: .\build-windows.ps1

      - name: Verify Windows artifact
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path . -Filter "*Windows*_v*.exe" -File -ErrorAction SilentlyContinue
          if (-not $artifacts -or $artifacts.Count -eq 0) {
            throw "Windows build did not produce *Windows*_v*.exe"
          }
          Write-Host "Found Windows artifact(s):"
          $artifacts | ForEach-Object { Write-Host "  - $($_.Name)" }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: "*Windows*_v*.exe"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || (github.event.inputs.tag_name || 'v3.1.8') }}
          files: "*Windows*_v*.exe"
          name: 小褚播放器 (xcplay) Windows Release ${{ github.ref_type == 'tag' && github.ref_name || (github.event.inputs.tag_name || 'v3.1.8') }}
          body: |
            ## 小褚播放器 (xcplay) Windows Release ${{ github.ref_type == 'tag' && github.ref_name || (github.event.inputs.tag_name || 'v3.1.8') }}
            
            ### ✨ 更新内容
            - **窗口标题乱码彻底修复**：配置 MSVC `/utf-8` 编译参数并在 Windows Runner 采用 Unicode 宽字符编码，彻底消除 Windows 11/10 窗口左上角标题乱码问题（解决 `å° è¤šæ’­æ”¾å™¨` 现象）。
            - **窗口自适应居中**：Windows 桌面端首次启动自动居中显示在屏幕中央，界面比例更舒适。
            - **全面消除 Moonfin Logo 残留**：重构认证、欢迎、设置关于、屏保、投屏预览等 9 处主界面的品牌组件（`AppBrandLogo`），全部自动适配并显示「小褚播放器 (xcplay)」品牌，彻底消除 Moonfin 英文字样残留。
            - **个人仓库与更新服务绑定**：应用内检查更新改连个人仓库 `cwxsss/Moonfin`，关于页面源码及问题反馈链接全面更新。
            - **播放联动窗口标题**：播放电影、剧集时，Windows 窗口标题实时联动当前视频名称，多任务切换一目了然。
            - **音频播放爆音/杂音修复**：
              - 调大 mpv 音频缓冲至 500ms（`audio-buffer=0.5`），彻底消除 WASAPI 渲染高负载下的 Buffer Underrun 断流撕裂杂音；
              - 开启多声道立体声下混防削波归一化（`audio-normalize-downmix=yes`），杜绝数字硬削波破音；
              - 升级 `scaletempo2` 高保真时钟拉伸滤镜与高质量重采样参数。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
